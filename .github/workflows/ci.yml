# Runs the suite on the Python the server has (3.12) and the one after it.
# Nothing to install: the bot is standard library only.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q bot tests
      - run: python -m unittest -v
